jelu:
  database:
    path: ${user.home}/.jelu/database/
    # Either delete (sqlite's classic rollback journal) or wal. WAL lets reads carry on while a write
    # is in flight, but only use it on a local disk, it isn't safe on network shares like NFS or SMB.
    # While running in wal, back up jelu.db-wal and jelu.db-shm along with jelu.db (or stop Jelu first).
    journalMode: delete
    # Size of the JDBC connection pool. Left unset it follows journalMode, 1 under delete, where a
    # writer locks out readers anyway and a single connection keeps Jelu from tripping over itself
    # with SQLITE_BUSY, and Hikari's usual 10 under wal so that reads can run alongside a write.
    # Setting spring.datasource.hikari.maximum-pool-size directly takes precedence over this.
    # poolSize: 1
  files:
    images: '${user.home}/.jelu/files/images/'
    imports: '${user.home}/.jelu/files/imports/'
  session:
    duration: 604800 #7 days
server:
  port: 11111
spring:
  web:
    resources:
      add-mappings: false
  mvc:
    throw-exception-if-no-handler-found: true
  liquibase:
    enabled: true
    drop-first: false
    change-log: classpath:liquibase.xml
  datasource:
    # busy_timeout makes a writer wait its turn instead of failing with SQLITE_BUSY the moment it's
    # blocked. We always set journal_mode, even to delete, because WAL is persisted in the db file
    # and would otherwise stick. The placeholder is kebab-case so that relaxed binding picks up
    # journalMode, journal-mode and JELU_DATABASE_JOURNALMODE alike.
    url: jdbc:sqlite:${jelu.database.path}/jelu.db?journal_mode=${jelu.database.journal-mode:delete}&busy_timeout=10000&foreign_keys=on;
    username: jelu_user
    password: mypass1234
    driver-class-name: org.sqlite.JDBC
  exposed:
    generate-ddl: false
    show-sql: false
  servlet:
    multipart:
      enabled: true
      location: ${java.io.tmpdir}
      max-request-size: 10MB
      max-file-size: 10MB
logging:
  logback.rollingpolicy.max-history: 10
  file:
    name: ${jelu.database.path}/jelu.log
    #    name: \${user.home}/.jelu/jelu.log
  level:
    io.github.bayang.jelu: DEBUG
